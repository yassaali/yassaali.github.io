<!DOCTYPE html>
<html lang="en" data-os="windows">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yassa Ali | Cybersecurity Intern &amp; IT Support</title>
<meta name="description" content="Portfolio of Yassa Ali, Cybersecurity Engineer Intern and aspiring IT Support Specialist.">
<meta name="theme-color" content="#0a1226">
<meta name="color-scheme" content="dark light">
<style>
/* ========== 1. TOKENS: deep navy base, light variant follows the device ========== */
:root{
  --bg:#0a1226; --bg2:#0f1b3a; --text:#e8eefc; --muted:#94a3b8;
  --accent:#38bdf8; --on-accent:#04101f; --accent-soft:rgba(56,189,248,.15); --warn:#fbbf24;
  --card:rgba(20,32,64,.6); --line:rgba(148,163,184,.2);
  /* skin tokens, overridden per OS below */
  --r:12px; --blur:0px; --fw:600; --track:-.01em;
  --shadow:0 1px 3px rgba(0,0,0,.3); --font:system-ui,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f4f7fc; --bg2:#e3ebfa; --text:#0b1530; --muted:#51607a; --accent:#0369a1; --on-accent:#fff;
    --accent-soft:rgba(3,105,161,.1); --warn:#b45309; --card:rgba(255,255,255,.72); --line:rgba(15,23,42,.14)}
}

/* ========== 2. OS SKINS (data-os is set by the script at the bottom) ========== */
/* Windows 11 Fluent: acrylic, hairline borders, tight corners, reveal highlight */
[data-os=windows]{--r:8px; --blur:30px; --fw:600; --track:-.01em;
  --font:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; --shadow:0 2px 8px rgba(0,0,0,.25)}
/* macOS / iOS: glass, big radii, deep soft shadows, SF Pro */
[data-os=apple]{--r:22px; --blur:26px; --fw:700; --track:-.03em;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",sans-serif;
  --shadow:0 22px 48px -14px rgba(0,0,0,.5)}
/* Android and everything else: solid elevated surfaces, Roboto */
[data-os=material]{--r:16px; --blur:0px; --fw:500; --track:0; --card:var(--bg2);
  --font:Roboto,"Google Sans",system-ui,sans-serif; --shadow:0 2px 6px rgba(0,0,0,.3),0 8px 16px rgba(0,0,0,.14)}

/* ========== 3. BASE ========== */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:var(--font);color:var(--text);line-height:1.6;min-height:100vh;
  background:radial-gradient(900px 520px at 88% -6%,rgba(56,189,248,.17),transparent),
             radial-gradient(700px 520px at -5% 35%,rgba(99,102,241,.13),transparent),var(--bg);
  background-attachment:fixed}
main{max-width:1000px;margin:0 auto;padding:0 20px 56px}
section{padding-top:56px}
h1,h2,h3{font-weight:var(--fw);letter-spacing:var(--track);line-height:1.2}
h2{font-size:1.55rem;margin-bottom:20px}
h3{font-size:1.08rem}
p,li{color:var(--muted)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ========== 4. SHARED COMPONENTS ========== */
